schema_version: 1

context:
  name: bdsim-g4
  version: "1.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/bdsim-collaboration/bdsim/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d8d056037629c32ff47d4306a7a210d1c73250336f22c75267ca8ddfe37520fb
  patches:
    - 0001-Skip-BDSBH4D-dictionary-when-USE_BOOST-is-off.patch

build:
  number: 0
  skip:
    - win
    # This feedstock has required geant4 >=11.2.2 since it was created. Stating
    # it here rather than as a version specifier on the host requirement leaves
    # the geant4 pin to conda-forge-pinning, and drops the 10.7.4 leg of the
    # zipped clhep/geant4 variant rather than failing it.
    - match(geant4, "<11.2.2")
  script: ${RECIPE_DIR}/build_bdsim.sh

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - cmake
    - make
    - bison
  host:
    - if: linux
      then: libgl-devel
    - clhep
    - xerces-c
    - root_base
    - root_cxx_standard
    - geant4
    # Geant4Config.cmake find_dependency()s EXPAT; geant4 itself only pulls in
    # libexpat, which has no headers.
    - expat
    - qt-main
    - libzlib
    - hepmc3
    - python
    - pybind11
    - pybind11-abi
  run:
    - python
tests:
  - files:
      recipe:
        - drift.gmad
    script:
      - bdsim --help
      - bdsim --file=drift.gmad --batch --ngenerate=100

about:
  summary: BDSIM is a code to make 3D models of particle accelerators using Geant4.
  description: |
    Beam Delivery Simulation (BDSIM) is a C++ program that utilises the Geant4 toolkit to simulate
    both the transport of particles in an accelerator and their interaction with the accelerator
    material. BDSIM is capable of simulating a wide variety of accelerator components and magnets
    with Geant4 geometry dynamically built based on a text input file. Thick lens accelerator
    tracking routines are provided for fast accurate tracking in a vacuum.
  license: GPL-3.0-or-later
  license_file: LICENCE.txt
  homepage: https://bdsim-collaboration.github.io/web
  repository: https://github.com/bdsim-collaboration/bdsim
  documentation: https://bdsim-collaboration.github.io/bdsim/sphinx/index.html

extra:
  recipe-maintainers:
    - stewartboogert
